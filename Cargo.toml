[package]
name = "cybermeta"
version = "0.3.0"
edition = "2021"
description = "Find and remove what your photos give away: lossless metadata scrubbing, privacy audit, TUI and CLI"
license = "MIT"

[[bin]]
name = "cybermeta"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line and TUI. Library users (the Android app) build with
# `default-features = false` and get only the metadata engine.
cli = ["dep:clap", "dep:crossterm", "dep:cybercore", "dep:ratatui"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { optional = true, version = "4", features = ["derive"] }
crc32fast = "1.5.2"
crossterm = { version = "0.29", optional = true }
cybercore = { version = "0.4", optional = true }
little_exif = "0.6"
miniz_oxide = "0.8"
nom-exif = "3.8.0"
quick-xml = "0.37"
ratatui = { version = "0.30", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
