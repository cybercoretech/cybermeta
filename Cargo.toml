[package]
name = "cybermeta"
version = "0.2.0"
edition = "2021"
description = "TUI-first EXIF workstation for the Cybercore Systems Framework"
license = "MIT"

[[bin]]
name = "cybermeta"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
cybercore = "0.4"
little_exif = "0.6"
miniz_oxide = "0.8"
quick-xml = "0.37"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
